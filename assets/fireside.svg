<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t d">
  <title id="t">Fireside</title>
  <desc id="d">A simple illustration of an open fire in a stone pub fireplace, with two empty armchairs and a pint on the hearth.</desc>
  <rect width="480" height="320" fill="#0f1a24"/>
  <radialGradient id="glow" cx="50%" cy="72%" r="60%">
    <stop offset="0" stop-color="#c9a24a" stop-opacity=".45"/>
    <stop offset="1" stop-color="#0f1a24" stop-opacity="0"/>
  </radialGradient>
  <rect width="480" height="320" fill="url(#glow)"/>
  <!-- beam -->
  <rect x="0" y="36" width="480" height="18" fill="#2c3e50"/>
  <!-- chimney breast -->
  <path d="M150 60h180v200H150z" fill="#3a4a5a"/>
  <g fill="#46586a">
    <rect x="156" y="66" width="52" height="22"/><rect x="214" y="66" width="52" height="22"/><rect x="272" y="66" width="52" height="22"/>
    <rect x="156" y="94" width="36" height="22"/><rect x="198" y="94" width="84" height="22"/><rect x="288" y="94" width="36" height="22"/>
  </g>
  <!-- mantel -->
  <rect x="136" y="122" width="208" height="12" rx="2" fill="#b08a3c"/>
  <!-- firebox -->
  <path d="M180 260v-92a60 40 0 0 1 120 0v92z" fill="#1a1a1a"/>
  <!-- flames -->
  <path d="M210 250c-6-24 8-34 14-52 4 16 14 18 12 36 8-10 10-22 6-36 18 18 26 36 18 52z" fill="#8b1e2d"/>
  <path d="M222 250c-2-14 6-22 10-32 4 10 10 14 8 24 6-6 6-14 4-22 10 12 12 22 6 30z" fill="#c9a24a"/>
  <!-- logs -->
  <rect x="200" y="246" width="80" height="10" rx="5" fill="#5c3b1e"/>
  <!-- hearth -->
  <rect x="120" y="260" width="240" height="14" fill="#2c3e50"/>
  <rect x="0" y="274" width="480" height="46" fill="#1a2a38"/>
  <!-- armchairs -->
  <g fill="#5c1420">
    <path d="M40 274v-70a18 18 0 0 1 18-18h44a18 18 0 0 1 18 18v70z"/>
    <rect x="30" y="226" width="20" height="48" rx="8"/><rect x="110" y="226" width="20" height="48" rx="8"/>
    <path d="M360 274v-70a18 18 0 0 1 18-18h44a18 18 0 0 1 18 18v70z"/>
    <rect x="350" y="226" width="20" height="48" rx="8"/><rect x="430" y="226" width="20" height="48" rx="8"/>
  </g>
  <!-- pint -->
  <path d="M322 238h16l-2 22h-12z" fill="#b08a3c"/>
  <rect x="322" y="234" width="16" height="6" fill="#f4f1ea"/>
</svg>
